# ============================================================================
# Deploy a ambiente DEV en Cloud Run via Cloud Build.
# Trigger: push o merge a la rama `develop`.
# Auth: Workload Identity Federation (sin JSON keys).
# ============================================================================
name: deploy-dev

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build + deploy a Cloud Run (dev)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # necesario para WIF

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP via WIF
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Submit Cloud Build (cloudbuild-staging.yaml)
        run: |
          gcloud builds submit . \
            --config=cloudbuild-staging.yaml \
            --project=${{ secrets.GCP_PROJECT }} \
            --substitutions=_GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"

      - name: Resolve service URL
        id: url
        run: |
          URL=$(gcloud run services describe login-service-dev \
            --region=southamerica-west1 \
            --project=${{ secrets.GCP_PROJECT }} \
            --format='value(status.url)')
          echo "service_url=$URL" >> $GITHUB_OUTPUT
          echo "::notice title=Deployed::login-service-dev → $URL"

      - name: Smoke test (/health)
        run: |
          set -e
          STATUS=$(curl -s -o /tmp/h.json -w "%{http_code}" "${{ steps.url.outputs.service_url }}/api-login/health")
          echo "HTTP $STATUS"
          cat /tmp/h.json
          [ "$STATUS" = "200" ]
